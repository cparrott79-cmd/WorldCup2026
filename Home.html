<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC2026 Prediction Game</title>
<style>
  :root{--bg:#0d1b2a;--card:#1b263b;--accent:#00b4d8;--win:#2a9d8f;--draw:#e9c46a;--text:#e0e1dd;--muted:#8d99ae;--gold:#ffd166;--qual:#2a9d8f;--third:#e9c46a;--danger:#e76f51;--lock:#8d99ae;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);padding:14px}
  header{text-align:center;margin-bottom:14px}
  h1{margin:0 0 4px;font-size:1.5rem}
  .sub{color:var(--muted);font-size:.85rem}
  .tabrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .tabrow.admin{margin:14px 0 8px}
  .tab{background:var(--card);border:1px solid #415a77;color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
  .tab.active{background:var(--accent);color:#001219;border-color:var(--accent);font-weight:700}
  .tab.enter{background:transparent;border:1px dashed var(--gold);color:var(--gold)}
  .tab.enter.active,.tab.enter:hover{background:var(--gold);color:#001219;border-color:var(--gold)}
  .tab.imp{background:transparent;border:1px dashed var(--win);color:var(--win)}
  .tab.imp.active,.tab.imp:hover{background:var(--win);color:#001219;border-color:var(--win)}
  .controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:12px 0}
  select,input[type=text],input[type=password],button,textarea{background:var(--card);color:var(--text);border:1px solid #415a77;border-radius:8px;padding:8px 12px;font-size:.9rem;font-family:inherit}
  button{cursor:pointer;transition:.2s}
  button:hover{background:var(--accent);color:#001219;border-color:var(--accent)}
  button.danger{border-color:var(--danger);color:var(--danger)}
  button.danger:hover{background:var(--danger);color:#001219;border-color:var(--danger)}
  .gate{max-width:420px;margin:40px auto;background:var(--card);border:1px solid #415a77;border-radius:14px;padding:24px;text-align:center}
  .gate h3{margin:0 0 6px;color:var(--accent)}
  .gate p{color:var(--muted);font-size:.85rem;margin:0 0 16px}
  .gate input{width:160px;text-align:center;font-size:1.2rem;letter-spacing:3px;margin-bottom:12px}
  .gate .err{color:var(--danger);font-size:.82rem;min-height:18px;margin-top:8px}
  .entry-name{max-width:560px;margin:0 auto 14px;background:var(--card);border:1px solid #415a77;border-radius:12px;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .entry-name label{font-size:.85rem;color:var(--muted)}
  .entry-name input{flex:1;min-width:160px}
  .import-panel{max-width:760px;margin:0 auto 14px;background:var(--card);border:1px solid #415a77;border-radius:12px;padding:16px}
  .import-panel h3{margin:0 0 6px;color:var(--accent);font-size:1rem}
  .import-panel p{color:var(--muted);font-size:.82rem;margin:0 0 10px}
  .import-panel textarea{width:100%;min-height:200px;resize:vertical}
  .import-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .import-row label{font-size:.82rem;color:var(--muted)}
  .go{background:var(--gold);color:#001219;border-color:var(--gold);font-weight:700}
  .go:hover{background:#ffdf85;border-color:#ffdf85;color:#001219}
  .report{margin-top:12px;font-size:.84rem;border-radius:8px;padding:10px 12px}
  .report.ok{background:#16302a;border:1px solid var(--win);color:#8ff0dd}
  .report.warn{background:#3d2c1b;border:1px solid var(--draw);color:#ffe3a0}
  .report.err{background:#3d1f1b;border:1px solid var(--danger);color:#ffb4a2}
  .report b{color:#fff}
  .stage-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 10px;flex-wrap:wrap}
  .stage-title{background:var(--accent);color:#001219;padding:6px 12px;border-radius:8px;font-weight:700;font-size:.92rem;margin:0}
  .stage-title .dbl{background:#001219;color:var(--gold);padding:1px 7px;border-radius:6px;font-size:.74rem;margin-left:8px}
  .submit-row{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:8px 0 18px}
  .exportbtn{background:var(--gold);color:#001219;border-color:var(--gold);font-weight:700}
  .exportbtn:hover{background:#ffdf85;border-color:#ffdf85;color:#001219}
  /* ---- Results match card: stacked rows (ported from predictions page) ---- */
  .match{background:var(--card);padding:10px 14px;border-radius:10px;margin-bottom:7px}
  .match.finalmatch{border:1px solid var(--gold)}
  .match-top{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}
  .side{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
  .team{font-weight:600;font-size:1rem;line-height:1.25;text-align:center;overflow-wrap:break-word;word-break:normal;hyphens:none;max-width:100%}
  .code{color:var(--muted);font-weight:400;font-size:.82rem}
  .meta{display:block;width:100%;text-align:center;margin-top:10px;padding-top:8px;border-top:1px solid #2b3a52;font-size:.72rem;color:var(--muted)}
  .meta .num{font-weight:600}
  .meta .dblpill{color:var(--gold);font-weight:700}
  .stepper{display:flex;align-items:center;gap:8px}
  .stepbtn{width:32px;height:32px;padding:0;font-size:1.2rem;font-weight:700;line-height:1;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;user-select:none;cursor:pointer;transition:.15s}
  .stepbtn.minus{background:#2b3a52;color:var(--text)}
  .stepbtn.minus:hover{background:#3a4d6b;color:#fff}
  .stepbtn.plus{background:var(--accent);color:#001219}
  .stepbtn.plus:hover{background:#33c6ec;color:#001219}
  .stepbtn:active{transform:scale(.9)}
  .scoreval{min-width:22px;text-align:center;font-size:1.2rem;font-weight:700;color:var(--text);background:none;border:none;padding:0}
  .scoreval.empty{color:var(--muted);font-weight:400}
  .prog-row{margin-top:10px;text-align:center}
  .prog{font-size:.78rem;padding:5px 8px;background:#0d1b2a;border:1px solid #415a77;color:var(--text);border-radius:6px;max-width:100%}
  .result-cell{margin-top:8px}
  .result{display:block;font-size:.7rem;text-align:center;padding:4px 6px;border-radius:6px;background:#0d1b2a;color:var(--muted)}
  .result.home,.result.away{background:var(--win);color:#001219;font-weight:700}
  .result.draw{background:var(--draw);color:#001219;font-weight:700}
  .result.pts{background:var(--gold);color:#001219;font-weight:700}
  /* ---- end results card ---- */
  .lbwrap{overflow-x:auto}
  table.lb{width:100%;max-width:1060px;margin:0 auto;border-collapse:collapse;font-size:.86rem}
  table.lb th,table.lb td{padding:9px 10px;text-align:center;border-bottom:1px solid #415a77;white-space:nowrap}
  table.lb th{color:var(--accent);font-size:.78rem}
  table.lb td.name{text-align:left;font-weight:600}
  table.lb td.total{font-weight:700;color:var(--gold);background:#15263b}
  table.lb th.total{color:var(--gold);background:#15263b}
  table.lb td.perfect,table.lb th.perfect{color:var(--win);font-weight:700}
  table.lb td.rank{color:var(--muted);width:36px}
  table.lb tr:first-child td.rank{color:var(--gold);font-size:1.05rem}
  .hint{max-width:1060px;margin:8px auto;color:var(--muted);font-size:.8rem;text-align:center}
  .admin-note{background:#3d2c1b;border:1px solid var(--draw);color:var(--draw);padding:8px 12px;border-radius:8px;max-width:920px;margin:0 auto 12px;font-size:.82rem;text-align:center}
  .missing-note{background:#3d1f1b;border:1px solid var(--danger);color:#ffb4a2;padding:10px 14px;border-radius:8px;max-width:920px;margin:0 auto 12px;font-size:.82rem}

  .third-panel{background:var(--card);border:1px solid #415a77;border-radius:12px;padding:14px 18px;max-width:920px;margin:0 auto 16px}
  .third-panel h3{margin:0 0 4px;color:var(--accent);font-size:.95rem}
  .third-panel .pdesc{color:var(--muted);font-size:.78rem;margin-bottom:12px}
  .third-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px 20px}
  .third-row{display:flex;align-items:center;gap:12px}
  .third-row label{font-size:.82rem;color:var(--text);font-weight:600;min-width:96px;text-align:right;flex-shrink:0}
  .third-row select{flex:1;min-width:0;font-size:.8rem;padding:6px}
  .chart-card{background:var(--card);border-radius:12px;padding:14px 16px;max-width:1060px;margin:0 auto 18px}
  .chart-card h3{margin:0 0 4px;color:var(--accent);font-size:1rem}
  .chart-card .pdesc{color:var(--muted);font-size:.78rem;margin-bottom:8px}
  .legend-chart{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px;font-size:.76rem}
  .legend-chart .li{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
  .legend-chart .ln{width:16px;height:3px;border-radius:2px;display:inline-block}
  .summary-wrap{max-width:1060px;margin:0 auto 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .scard{background:var(--card);border-radius:12px;padding:12px 14px;border-left:4px solid var(--accent)}
  .scard h4{margin:0 0 6px;font-size:.95rem;color:var(--text)}
  .scard h4 .badge{font-size:.72rem;color:var(--muted);font-weight:400}
  .scard p{margin:0;font-size:.82rem;color:var(--muted);line-height:1.45}
  .scard .stat{color:var(--gold);font-weight:700}
  .groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;max-width:1100px;margin:0 auto}
  .gcard{background:var(--card);border-radius:12px;padding:10px 12px}
  .gcard h3{margin:2px 0 8px;color:var(--accent);font-size:1rem}
  table.gt{width:100%;border-collapse:collapse;font-size:.82rem}

  table.gt td{padding:5px 3px;text-align:center;border-bottom:1px solid #2a3a52}
  table.gt td.tname{text-align:left;font-weight:600}
  table.gt td.pos{color:var(--muted);width:22px}
  table.gt tr.q1 td.pos,table.gt tr.q2 td.pos{color:var(--qual);font-weight:700}
  table.gt tr.q1 td.tname,table.gt tr.q2 td.tname{border-left:3px solid var(--qual);padding-left:6px}
  table.gt tr.q3 td.tname{border-left:3px solid var(--third);padding-left:6px}
  table.gt td.pts{font-weight:700;color:var(--gold)}
  .legend{max-width:1100px;margin:14px auto 0;color:var(--muted);font-size:.78rem;text-align:center}
  .legend span{display:inline-block;margin:0 8px}
  .swatch{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:4px}
  /* ---- All Predictions: transposed grid ---- */
  .mx-toolbar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:0 auto 12px;max-width:1100px}
  .mx-toolbar .info{color:var(--muted);font-size:.8rem}
  .matrixwrap{overflow-x:auto;max-width:100%;border:1px solid #2a3a52;border-radius:10px}
  table.matrix{border-collapse:separate;border-spacing:0;font-size:.82rem;width:max-content;min-width:100%}
  table.matrix th,table.matrix td{border-bottom:1px solid #2a3a52;white-space:nowrap}
  table.matrix tr.dayband th{position:sticky;top:0;z-index:5;background:#10202f;color:var(--accent);font-weight:700;text-align:left;padding:6px 10px;font-size:.8rem}
  table.matrix tr.dayband th.namecorner{left:0;z-index:7;background:#10202f}
  table.matrix thead tr.games th{position:sticky;z-index:4;background:#15263b;color:var(--text);vertical-align:top;
    width:140px;min-width:140px;max-width:140px;padding:6px 6px;font-weight:600;font-size:.74rem;text-align:center}
  table.matrix thead tr.games th.gh-final{border:1px solid var(--gold)}
  table.matrix thead tr.games th .gh-hide{display:inline-flex;align-items:center;gap:4px;margin:0 0 5px;color:var(--muted);font-size:.66rem;cursor:pointer}
  table.matrix thead tr.games th .gh-hide input{vertical-align:middle}
  table.matrix thead tr.games th .gh-teams{font-weight:700;line-height:1.2}
  table.matrix thead tr.games th .gh-v{color:var(--muted);font-weight:400;font-size:.68rem}
  table.matrix thead tr.games th .gh-meta{color:var(--muted);font-weight:400;font-size:.66rem;margin-top:2px}
  table.matrix tr.dayband th{top:0}
  table.matrix thead tr.games th{top:31px}
  /* Player column: shrink-wrap to the longest name; that width applies to every row */
  table.matrix th.namecol,table.matrix td.namecol{position:sticky;left:0;z-index:3;background:var(--card);
    width:1px;white-space:nowrap;padding:7px 6px 7px 6px;text-align:left;font-weight:700;box-shadow:1px 0 0 #2a3a52}
  table.matrix thead tr.games th.namecol{z-index:6;background:#15263b}
  table.matrix td.cell{text-align:center;padding:6px 6px;font-variant-numeric:tabular-nums;width:140px;min-width:140px;max-width:140px}
  table.matrix td.cell .sc{font-size:.95rem;font-weight:700}
  table.matrix td.cell .rs{display:block;font-size:.66rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
  table.matrix td.cell .rs.home,table.matrix td.cell .rs.away{color:var(--win)}
  table.matrix td.cell .rs.draw{color:var(--draw)}
  table.matrix td.cell.empty{color:#43526a}
  table.matrix tr:nth-child(even) td.cell{background:rgba(255,255,255,.015)}
  @media(max-width:640px){
    .team{font-size:.95rem}
    .stepper{gap:6px}
    .stepbtn{width:30px;height:30px}
    .third-row label{min-width:80px}
  }
</style>
</head>

function scoreMatch(pred,res,ko,num){
  if(!pred||!res)return null;
  if(pred.h===""||pred.a===""||res.h===""||res.a==="")return null;
  const ph=+pred.h,pa=+pred.a,rh=+res.h,ra=+res.a;
  let pts=0,resultOK;
  if(ko){let ap=rh>ra?"H":ra>rh?"A":(res.pen||"");let pp=ph>pa?"H":pa>ph?"A":(pred.prog||"");resultOK=pp!==""&&pp===ap;}
  else{const pr=ph>pa?"H":pa>ph?"A":"D";const rr=rh>ra?"H":ra>rh?"A":"D";resultOK=pr===rr;}
  const homeOK=ph===rh,awayOK=pa===ra;
  if(resultOK)pts+=2;if(homeOK)pts+=2;if(awayOK)pts+=2;
  if(resultOK&&homeOK&&awayOK)pts+=2;
  if(num===FINAL_MATCH)pts*=2;
  return pts;
}

function computeGroups(){
  const groups={};
  FIXTURES.forEach(f=>{const[num,,,home,away,fstage,group]=f;if(isKO(num)||!group)return;
    groups[group]=groups[group]||{};
    [home,away].forEach(t=>{groups[group][t]=groups[group][t]||{team:t,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0};});});
  FIXTURES.forEach(f=>{const[num,,,home,away,fstage,group]=f;if(isKO(num)||!group)return;
    const r=data.results[num];if(!r||r.h===""||r.a==="")return;
    const rh=+r.h,ra=+r.a,H=groups[group][home],A=groups[group][away];
    H.P++;A.P++;H.GF+=rh;H.GA+=ra;A.GF+=ra;A.GA+=rh;
    if(rh>ra){H.W++;A.L++;H.Pts+=3;}else if(ra>rh){A.W++;H.L++;A.Pts+=3;}else{H.D++;A.D++;H.Pts++;A.Pts++;}});
  const out={};
  Object.keys(groups).sort().forEach(g=>{const arr=Object.values(groups[g]);arr.forEach(t=>t.GD=t.GF-t.GA);
    arr.sort((a,b)=>b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF||a.team.localeCompare(b.team));out[g]=arr;});
  return out;
}
function resolveCode(code){
  if(!code)return null;
  let m=code.match(/^([12])([A-L])$/);
  if(m){const pos=+m[1]-1,grp=m[2],table=computeGroups()[grp];if(!table)return null;
    if(!table.every(t=>t.P>=3))return null;return table[pos]?table[pos].team:null;}
  if(/^3[A-L]+$/.test(code))return data.thirds[code]||null;
  m=code.match(/^W(\d+)$/);
  if(m){const mn=+m[1],r=data.results[mn];if(!r||r.h===""||r.a==="")return null;
    const rh=+r.h,ra=+r.a,f=FIXTURES.find(x=>x[0]===mn);let winSide=rh>ra?"H":ra>rh?"A":(r.pen||"");
    if(winSide==="")return null;return resolveTeam(winSide==="H"?f[3]:f[4]);}
  m=code.match(/^RU(\d+)$/);
  if(m){const mn=+m[1],r=data.results[mn];if(!r||r.h===""||r.a==="")return null;
    const rh=+r.h,ra=+r.a,f=FIXTURES.find(x=>x[0]===mn);let loseSide=rh>ra?"A":ra>rh?"H":(r.pen==="H"?"A":r.pen==="A"?"H":"");
    if(loseSide==="")return null;return resolveTeam(loseSide==="H"?f[3]:f[4]);}
  return null;
}
function isCode(s){return /^([12][A-L]|3[A-L]+|W\d+|RU\d+)$/.test(s);}
function resolveTeam(c){return isCode(c)?resolveCode(c):c;}
function displayTeam(c){const r=resolveTeam(c);if(r&&r!==c)return{name:r,code:c};if(isCode(c))return{name:null,code:c};return{name:c,code:null};}
function thirdPlacedTeams(){const groups=computeGroups(),out={};Object.keys(groups).forEach(g=>{if(groups[g][2])out[g]=groups[g][2].team;});return out;}

function parsePredictions(text){
  const lines=text.split(/\r?\n/);
  let name="";const entries=[];const errors=[];
  lines.forEach(raw=>{
    const line=raw.trim();
    if(!line)return;
    const nm=line.match(/predictions\s*[—\-:]\s*(.+)$/i);
    if(nm){name=nm[1].trim();return;}
    if(/^\[.*\]$/.test(line))return;
    if(/^WC2026/i.test(line))return;
    const numMatch=line.match(/^#?\s*(\d+)[.)]?\s+(.*)$/);
    if(!numMatch){if(/\d+\s*[-–:]\s*\d+/.test(line))errors.push(line);return;}
    const num=+numMatch[1];const rest=numMatch[2];
    const scoreMatch=rest.match(/(\d+)\s*[-–:]\s*(\d+)/);
    if(!scoreMatch){errors.push(line);return;}
    const h=scoreMatch[1], a=scoreMatch[2];
    const winMatch=rest.match(/[>›→]\s*(.+)$/);
    const winnerName=winMatch?winMatch[1].trim():"";
    const f=FIXTURES.find(x=>x[0]===num);
    if(!f){errors.push("Unknown match #: "+line);return;}
    const entry={num,h:String(+h),a:String(+a),prog:""};
    if(isKO(num)&&(+h===+a)&&winnerName){
      const low=winnerName.toLowerCase();
      if(f[3].toLowerCase()===low)entry.prog="H";
      else if(f[4].toLowerCase()===low)entry.prog="A";
      else if(f[3].toLowerCase().includes(low)||low.includes(f[3].toLowerCase()))entry.prog="H";
      else if(f[4].toLowerCase().includes(low)||low.includes(f[4].toLowerCase()))entry.prog="A";
    }
    entries.push(entry);
  });
  return{name,entries,errors};
}

function doImport(){
  const text=document.getElementById("pasteBox").value;
  const chosen=document.getElementById("playerSel").value;
  if(!text.trim()){importReport={cls:"err",msg:"Nothing pasted. Paste the WhatsApp text first."};render();return;}
  const parsed=parsePredictions(text);
  let target=chosen;
  if(!target){const det=parsed.name.toLowerCase();target=data.players.find(p=>p.toLowerCase()===det)||"";}
  if(!target){importReport={cls:"warn",msg:`<b>Couldn't match a player.</b> Detected name: "${parsed.name||"(none)"}" — pick the player from the dropdown and import again.`};render();return;}
  if(!parsed.entries.length){importReport={cls:"err",msg:`<b>No predictions found.</b> Each line should look like "1. Mexico 1-1 South Africa".`};render();return;}
  data.preds[target]=data.preds[target]||{};
  parsed.entries.forEach(en=>{data.preds[target][en.num]={h:en.h,a:en.a,prog:en.prog};});
  save();
  let msg=`<b>Imported ${parsed.entries.length} prediction${parsed.entries.length===1?"":"s"} for ${target}.</b>`;
  if(parsed.errors.length){
    msg+=`<br>⚠️ ${parsed.errors.length} line${parsed.errors.length===1?"":"s"} couldn't be read and were skipped:<br>`+parsed.errors.map(e=>"• "+e).join("<br>");
    importReport={cls:"warn",msg};
  }else{importReport={cls:"ok",msg:msg+" No errors. 👍"};}
  render();
  const box=document.getElementById("pasteBox");if(box&&!parsed.errors.length)box.value="";
}

function missingForRoundEntry(round){
  const items=[];
  FIXTURES.forEach(f=>{
    const num=f[0];if(!round.test(num))return;
    const rec=data.entry.preds[num]||{h:"",a:"",prog:""};
    const probs=[];
    if(rec.h==="")probs.push("home score");
    if(rec.a==="")probs.push("away score");
    if(isKO(num)&&rec.h!==""&&rec.a!==""&&(+rec.h===+rec.a)&&!rec.prog)probs.push("who goes through (draw)");
    if(probs.length)items.push("Match "+num+": "+probs.join(", "));
  });
  return items;
}
let entryMissing=null;
function exportRound(round){

  render();
}

    total++;
    const knockout=isKO(num);
    let rec=data.entry.preds[num]||{h:"",a:"",prog:""};
    if(rec.h!==""&&rec.a!=="")done++;
    if(round.key!==lastRoundKey){
      if(openRound)html+=closeRoundFooter(openRound);
      lastRoundKey=round.key;openRound=round;
      const dbl=isFinal?`<span class="dbl">POINTS ×2</span>`:"";
      html+=`<div class="stage-row"><div class="stage-title">${round.label}${dbl}</div></div>`;
    }
    const groupTxt=group?"Group "+group+" · ":"";
    const{lab,cls}=entryLabel(num);
    let pickHtml="";
    if(knockout){const val=rec.prog||"";
      pickHtml=`<select class="prog" data-num="${num}" data-field="prog" title="Who goes through">
        <option value="">Who goes through…</option>
        <option value="H"${val==="H"?" selected":""}>${homeName}</option>
        <option value="A"${val==="A"?" selected":""}>${awayName}</option></select>`;}
    const dblPill=isFinal?` · <span class="dblpill">points ×2</span>`:"";
    const hDisp=rec.h===""?"–":rec.h, aDisp=rec.a===""?"–":rec.a;
    html+=`<div class="match${isFinal?" finalmatch":""}" data-matchnum="${num}" data-entry="1">
      <div class="match-top">
        <div class="side">
          <div class="team home">${homeLabel}</div>
          <div class="stepper">
            <button type="button" class="stepbtn minus" data-estep="-1" data-num="${num}" data-side="h" aria-label="Decrease home score">−</button>
            <span class="scoreval${rec.h===""?" empty":""}" data-num="${num}" data-side="h">${hDisp}</span>
            <button type="button" class="stepbtn plus" data-estep="1" data-num="${num}" data-side="h" aria-label="Increase home score">+</button>
          </div>
        </div>
        <div class="side">
          <div class="team away">${awayLabel}</div>
          <div class="stepper">
            <button type="button" class="stepbtn minus" data-estep="-1" data-num="${num}" data-side="a" aria-label="Decrease away score">−</button>
            <span class="scoreval${rec.a===""?" empty":""}" data-num="${num}" data-side="a">${aDisp}</span>
            <button type="button" class="stepbtn plus" data-estep="1" data-num="${num}" data-side="a" aria-label="Increase away score">+</button>
          </div>
        </div>
      </div>
      ${pickHtml?`<div class="prog-row">${pickHtml}</div>`:""}
      <div class="meta"><span class="num">#${num}</span> · ${groupTxt}${date} · ${ko}${knockout?" · KO":""}${dblPill}</div>
      <div class="result-cell" data-result="${num}"><span class="${cls}">${lab}</span></div>
    </div>`;
  });
  if(openRound)html+=closeRoundFooter(openRound);
  contextLabel.textContent+=` · ${done}/${total} entered`;
  content.innerHTML=html;
  const nm=document.getElementById("entryName");
  if(nm)nm.addEventListener("input",e=>{data.entry.name=e.target.value;save();});
}
// entry steppers
function updateEntryLabel(num){
  num=+num;
  const cell=content.querySelector('.result-cell[data-result="'+num+'"]');
  if(!cell)return;
  const{lab,cls}=entryLabel(num);
  cell.innerHTML='<span class="'+cls+'">'+lab+'</span>';
}
function updateEntryScoreDisplay(num,side){
  num=+num;
  const row=content.querySelector('.match[data-matchnum="'+num+'"]');if(!row)return;
  const valEl=row.querySelector('.scoreval[data-num="'+num+'"][data-side="'+side+'"]');if(!valEl)return;
  const rec=data.entry.preds[num]||{h:"",a:"",prog:""};
  const v=rec[side];
  valEl.textContent=v===""?"–":v;
  valEl.classList.toggle("empty",v==="");
}
function adjustEntryScore(num,side,delta){
  num=+num;
  const s=data.entry.preds[num]=data.entry.preds[num]||{h:"",a:"",prog:""};
  let cur=s[side]===""?0:(+s[side]||0);
  cur+=delta;if(cur<0)cur=0;if(cur>99)cur=99;
  s[side]=String(cur);
  save();
  updateEntryScoreDisplay(num,side);
  updateEntryLabel(num);
}

function renderGroups(){
  contextLabel.textContent="Live group standings (from actual results)";
  const groups=computeGroups();let html=`<div class="groups">`;
  Object.keys(groups).forEach(g=>{
    let rows="";
    groups[g].forEach((t,i)=>{const cls=i===0?"q1":i===1?"q2":i===2?"q3":"";
      rows+=`<tr class="${cls}"><td class="pos">${i+1}</td><td class="tname">${t.team}</td>
        <td>${t.P}</td><td>${t.W}</td><td>${t.D}</td><td>${t.L}</td>
        <td>${t.GF}</td><td>${t.GA}</td><td>${t.GD>0?"+":""}${t.GD}</td><td class="pts">${t.Pts}</td></tr>`;});
    html+=`<div class="gcard"><h3>Group ${g}</h3><table class="gt">
      <tr><th></th><th style="text-align:left">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>
      ${rows}</table></div>`;});
  html+=`</div><div class="legend">
    <span><span class="swatch" style="background:var(--qual)"></span>Top 2 — qualify automatically</span>
    <span><span class="swatch" style="background:var(--third)"></span>3rd — assign to Round of 32 in the Results tab</span>
  </div><div class="hint">Ranking: Points → Goal Difference → Goals For → alphabetical. Updates as you enter results.</div>`;
  content.innerHTML=html;
}

// ---------- ALL PREDICTIONS ----------
function renderMatrix(){
  const hiddenCount=Object.values(data.hidden).filter(Boolean).length;
  contextLabel.textContent="All predictions — players down, games across";
  const q=search.value.trim().toLowerCase();
  const filter=FILTERS.find(f=>f.val===stageFilter.value)||FILTERS[0];
  const visible=FIXTURES.filter(f=>{
    const[num,,,homeCode,awayCode]=f;
    if(!filter.test(num))return false;
    if(data.hidden[num])return false;
    if(q){const hN=resolveTeam(homeCode)||homeCode,aN=resolveTeam(awayCode)||awayCode;
      const hay=(hN+" "+aN+" "+homeCode+" "+awayCode).toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
  let html=`<div class="mx-toolbar">
    <button class="go" id="unhideAll">↺ Unhide all</button>
    <span class="info">${hiddenCount} game${hiddenCount===1?"":"s"} hidden · tick a game's box to hide it</span>
  </div>`;
  if(!visible.length){
    html+=`<div class="hint">No games to show (everything is hidden or filtered out). Use <b>Unhide all</b> or change the stage filter.</div>`;
    content.innerHTML=html;
    document.getElementById("unhideAll").onclick=()=>{data.hidden={};save();render();};
    return;
  }
  let lastDay=null, span=0, bandCells="";
  function flushBand(){ if(span>0){bandCells+=`<th colspan="${span}">${lastDay}</th>`;} }
  visible.forEach(f=>{const date=f[1];if(date!==lastDay){flushBand();lastDay=date;span=1;}else{span++;}});
  flushBand();
  const dayBands=`<tr class="dayband"><th class="namecorner namecol">Player</th>${bandCells}</tr>`;
  let gameHdr=`<tr class="games"><th class="namecol">&nbsp;</th>`;
  visible.forEach(f=>{
    const[num,date,ko,homeCode,awayCode,fstage,group]=f;
    const hN=resolveTeam(homeCode)||homeCode, aN=resolveTeam(awayCode)||awayCode;
    const isFinal=num===FINAL_MATCH;
    gameHdr+=`<th class="${isFinal?'gh-final':''}">
      <label class="gh-hide"><input type="checkbox" data-hide="${num}"> Hide</label>
      <div class="gh-teams">${hN}</div>
      <div class="gh-v">v</div>
      <div class="gh-teams">${aN}</div>
      <div class="gh-meta">#${num} · ${ko}${isFinal?" · ×2":""}</div>
    </th>`;
  });
  gameHdr+=`</tr>`;
  let bodyRows="";
  data.players.forEach(p=>{
    let cells="";
    visible.forEach(f=>{
      const[num,,,homeCode,awayCode]=f;
      const hN=resolveTeam(homeCode)||homeCode, aN=resolveTeam(awayCode)||awayCode;
      const rec=data.preds[p][num];
      if(!rec||rec.h===""||rec.a===""){cells+=`<td class="cell empty">–</td>`;}
      else{
        const h=+rec.h,a=+rec.a;
        let resName,resCls;
        if(h>a){resName=hN;resCls="home";}
        else if(a>h){resName=aN;resCls="away";}
        else{
          if(isKO(num)&&rec.prog){resName=(rec.prog==="H"?hN:aN)+" (pens)";resCls="draw";}
          else{resName="Draw";resCls="draw";}
        }
        cells+=`<td class="cell"><span class="sc">${rec.h}–${rec.a}</span><span class="rs ${resCls}">${resName}</span></td>`;
      }
    });
    bodyRows+=`<tr><td class="namecol">${p}</td>${cells}</tr>`;
  });
  html+=`<div class="matrixwrap"><table class="matrix">
    <thead>${dayBands}${gameHdr}</thead>
    <tbody>${bodyRows}</tbody>
  </table></div>
  <div class="hint">Players are fixed on the left; swipe sideways for more games. Each cell shows the predicted score and result. Tick a game's <b>Hide</b> box to remove it; <b>Unhide all</b> brings them back.</div>`;
  content.innerHTML=html;
  document.getElementById("unhideAll").onclick=()=>{data.hidden={};save();render();};
}

function computeStats(){
  return data.players.map(p=>{
    const b={};BUCKETS.forEach(x=>b[x.key]=0);
    let total=0,scored=0,perfect=0,resultHits=0,homeHits=0,awayHits=0;
    FIXTURES.forEach(f=>{
      const num=f[0];const pred=data.preds[p][num],res=data.results[num];
      const s=scoreMatch(pred,res,isKO(num),num);
      if(s!==null){
        total+=s;scored++;const bk=BUCKETS.find(x=>x.test(num));if(bk)b[bk.key]+=s;
        const maxForMatch=num===FINAL_MATCH?16:8;if(s===maxForMatch)perfect++;
        const ph=+pred.h,pa=+pred.a,rh=+res.h,ra=+res.a;
        let resultOK;
        if(isKO(num)){let ap=rh>ra?"H":ra>rh?"A":(res.pen||"");let pp=ph>pa?"H":pa>ph?"A":(pred.prog||"");resultOK=pp!==""&&pp===ap;}
        else{const pr=ph>pa?"H":pa>ph?"A":"D";const rr=rh>ra?"H":ra>rh?"A":"D";resultOK=pr===rr;}
        if(resultOK)resultHits++;if(ph===rh)homeHits++;if(pa===ra)awayHits++;
      }
    });
    const avg=scored?total/scored:0;
    return{player:p,total,scored,perfect,avg,resultHits,homeHits,awayHits,b};
  }).sort((a,b)=>b.total-a.total);
}
function cumulativeSeries(stat){let run=0;return BUCKETS.map(x=>{run+=stat.b[x.key]||0;return run;});}
function buildChartSVG(stats){
  const W=1000,H=320,padL=44,padR=16,padT=18,padB=46;
  const xs=BUCKETS.length;
  const maxY=Math.max(10,...stats.map(s=>cumulativeSeries(s).slice(-1)[0]||0));
  const plotW=W-padL-padR,plotH=H-padT-padB;
  const xAt=i=>padL+(xs<=1?0:(plotW*i/(xs-1)));
  const yAt=v=>padT+plotH-(plotH*v/maxY);
  let grid="";const steps=5;
  for(let i=0;i<=steps;i++){const v=Math.round(maxY*i/steps);const y=yAt(v);
    grid+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#2a3a52" stroke-width="1"/>
      <text x="${padL-8}" y="${y+4}" fill="#8d99ae" font-size="11" text-anchor="end">${v}</text>`;}
  let xlab="";BUCKETS.forEach((b,i)=>{const x=xAt(i);
    xlab+=`<text x="${x}" y="${H-padB+20}" fill="#8d99ae" font-size="11" text-anchor="middle">${b.label}</text>`;});
  let lines="";
  stats.forEach((s,si)=>{
    const col=SERIES_COLORS[si%SERIES_COLORS.length];
    const pts=cumulativeSeries(s);
    const d=pts.map((v,i)=>`${i===0?"M":"L"}${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(" ");
    lines+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>`;
    pts.forEach((v,i)=>{lines+=`<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(v).toFixed(1)}" r="3" fill="${col}"/>`;});
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img">${grid}${xlab}${lines}</svg>`;
}
function buildChartLegend(stats){
  return `<div class="legend-chart">`+stats.map((s,si)=>{
    const col=SERIES_COLORS[si%SERIES_COLORS.length];
    return `<span class="li"><span class="ln" style="background:${col}"></span>${s.player}</span>`;}).join("")+`</div>`;
}
function buildSummary(stats){
  const anyScored=stats.some(s=>s.scored>0);
  if(!anyScored){return `<div class="summary-wrap"><div class="scard" style="grid-column:1/-1;border-left-color:var(--muted)">
      <h4>No results scored yet</h4><p>Enter actual results in the 🎯 Results tab and a performance summary will appear here automatically.</p></div></div>`;}
  const leader=stats[0];
  const cards=stats.map((s,i)=>{
    const pos=i+1;const ordinal=pos===1?"1st":pos===2?"2nd":pos===3?"3rd":pos+"th";
    const accuracy=s.scored?Math.round(100*s.resultHits/s.scored):0;
    let blurb;
    if(s.scored===0){blurb=`No scored predictions yet.`;}
    else{const gap=leader.total-s.total;
      const lead=i===0?`Out in front on <span class="stat">${s.total}</span> pts.`:`<span class="stat">${gap}</span> pt${gap===1?"":"s"} behind the leader (${leader.player}).`;
      blurb=`${lead} Correct outcome in <span class="stat">${s.resultHits}/${s.scored}</span> games (${accuracy}%), `
        +`nailed the home score <span class="stat">${s.homeHits}</span>× and away score <span class="stat">${s.awayHits}</span>×, `
        +`with <span class="stat">${s.perfect}</span> perfect prediction${s.perfect===1?"":"s"}. `
        +`Averaging <span class="stat">${s.avg.toFixed(1)}</span> pts per scored game.`;}
    return `<div class="scard"><h4>${s.player} <span class="badge">— ${ordinal}, ${s.total} pts</span></h4><p>${blurb}</p></div>`;
  }).join("");
  return `<div class="summary-wrap">${cards}</div>`;
}
function renderLeaderboard(){
  contextLabel.textContent="Overall standings, trend & summary";
  const stats=computeStats();
  let header=`<tr><th>#</th><th style="text-align:left">Player</th><th class="total">Total</th>`;
  BUCKETS.forEach(x=>header+=`<th>${x.label}</th>`);header+=`<th class="perfect">Perfect</th></tr>`;
  let rows="";let rank=0,prev=null;
  stats.forEach((t,i)=>{
    if(t.total!==prev){rank=i+1;prev=t.total;}
    let cells="";BUCKETS.forEach(x=>cells+=`<td>${t.b[x.key]||0}</td>`);
    rows+=`<tr><td class="rank">${rank}</td><td class="name">${t.player}</td><td class="total">${t.total}</td>${cells}<td class="perfect">${t.perfect}</td></tr>`;
  });
  const table=`<div class="lbwrap"><table class="lb">${header}${rows}</table></div>
    <div class="hint">Total sits beside the name; stage breakdown across (Final column is doubled). <b>Perfect</b> counts exact-scoreline predictions (Final perfect = 16).</div>`;
  const chart=`<div class="chart-card"><h3>📈 Cumulative points by stage</h3>
    <div class="pdesc">Each line is a player's running total as the tournament progresses (Final points are doubled).</div>
    ${buildChartSVG(stats)}${buildChartLegend(stats)}</div>`;
  const summaryTitle=`<div class="stage-title" style="max-width:1060px;margin:18px auto 10px">📝 How each player is performing</div>`;
  content.innerHTML=table+chart+summaryTitle+buildSummary(stats);
}

// ---- event handlers ----
content.addEventListener("click",e=>{
  const btn=e.target.closest(".stepbtn");
  if(btn){
    if(view.mode==="results"&&btn.dataset.step!==undefined){
      adjustResultScore(btn.dataset.num,btn.dataset.side,+btn.dataset.step);return;
    }
    if(view.mode==="entry"&&btn.dataset.estep!==undefined){
      adjustEntryScore(btn.dataset.num,btn.dataset.side,+btn.dataset.estep);return;
    }
  }
  const exp=e.target.dataset.export;
  if(exp){const round=ROUNDS.find(r=>r.key===exp);exportRound(round);}
});
content.addEventListener("input",e=>{
  if(e.target.id==="entryName"){data.entry.name=e.target.value;save();}
});
content.addEventListener("change",e=>{
  if(e.target.dataset.hide!==undefined){
    const n=e.target.dataset.hide;
    if(e.target.checked)data.hidden[n]=true; else delete data.hidden[n];
    save();render();return;
  }
  if(e.target.dataset.slot){data.thirds[e.target.dataset.slot]=e.target.value;save();render();return;}
  if(e.target.dataset.field){
    const num=e.target.dataset.num;
    if(view.mode==="results"){
      const store=data.results[num]=data.results[num]||{h:"",a:"",pen:""};
      store[e.target.dataset.field]=e.target.value;save();updateResultsLabel(+num);
    }else if(view.mode==="entry"){
      const store=data.entry.preds[num]=data.entry.preds[num]||{h:"",a:"",prog:""};
      store[e.target.dataset.field]=e.target.value;save();updateEntryLabel(+num);
    }
  }
});

stageFilter.addEventListener("change",()=>{entryMissing=null;render();});
search.addEventListener("input",render);

document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="wc2026-game-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();
};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
clearBtn.onclick=clearAllResults;
document.getElementById("importFile").onchange=e=>{
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const loaded=JSON.parse(r.result);
      if(!loaded.results)throw new Error("Not a valid backup file");
      data=loaded;data.players=data.players||DEFAULT_PLAYERS.slice();
      data.preds=data.preds||{};data.results=data.results||{};data.thirds=data.thirds||{};data.pins=data.pins||{};
      data.entry=data.entry||{name:"",preds:{}};data.hidden=data.hidden||{};
      data.players.forEach(p=>{data.preds[p]=data.preds[p]||{};});
      save();view={mode:"leaderboard"};render();alert("Backup imported successfully ✅");
    }catch(err){alert("Could not import: "+err.message);}
  };
  r.readAsText(file);
};

render();
