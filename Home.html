<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC2026 Prediction Game</title>

  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);padding:14px}
  header{text-align:center;margin-bottom:14px}
  h1{margin:0 0 4px;font-size:1.5rem}
  .sub{color:var(--muted);font-size:.85rem}
  .tabrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .tabrow.admin{margin:14px 0 8px}
  .tabrow.players{margin:0 0 6px;padding-top:10px;border-top:1px solid #2a3a52}
  .tab{background:var(--card);border:1px solid #415a77;color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
  .tab.active{background:var(--accent);color:#001219;border-color:var(--accent);font-weight:700}
  .tab.addbtn{background:transparent;border:1px dashed #415a77;color:var(--accent)}
  .tab.addbtn:hover{background:var(--accent);color:#001219}
  .tab .rm{color:var(--danger);font-weight:700;font-size:.95rem;line-height:1;opacity:.7}
  .tab .rm:hover{opacity:1}
  .tab .pinmark{font-size:.7rem;opacity:.7}
  .controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:12px 0}
  select,input[type=text],input[type=password],button{background:var(--card);color:var(--text);border:1px solid #415a77;border-radius:8px;padding:8px 12px;font-size:.9rem}
  button{cursor:pointer;transition:.2s}
  button:hover{background:var(--accent);color:#001219;border-color:var(--accent)}
  button.danger{border-color:var(--danger);color:var(--danger)}
  button.danger:hover{background:var(--danger);color:#001219;border-color:var(--danger)}
  .addbox{display:flex;gap:8px;justify-content:center;align-items:center;margin:0 0 14px}
  .addbox input{min-width:220px}
  .addbox .go{background:var(--accent);color:#001219;border-color:var(--accent);font-weight:700}
  .gate{max-width:420px;margin:40px auto;background:var(--card);border:1px solid #415a77;border-radius:14px;padding:24px;text-align:center}
  .gate h3{margin:0 0 6px;color:var(--accent)}
  .gate p{color:var(--muted);font-size:.85rem;margin:0 0 16px}
  .gate input{width:160px;text-align:center;font-size:1.2rem;letter-spacing:3px;margin-bottom:12px}
  .gate .err{color:var(--danger);font-size:.82rem;min-height:18px;margin-top:8px}
  .gate .setpin{margin-top:16px;border-top:1px solid #2a3a52;padding-top:12px;color:var(--muted);font-size:.8rem}
  .player-toolbar{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .player-toolbar .relock{border-color:var(--lock);color:var(--lock)}
  .stage-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 10px;flex-wrap:wrap}
  .stage-title{background:var(--accent);color:#001219;padding:6px 12px;border-radius:8px;font-weight:700;font-size:.92rem;margin:0}
  .stage-title.locked{background:var(--lock);color:#001219}
  .stage-title .dbl{background:#001219;color:var(--gold);padding:1px 7px;border-radius:6px;font-size:.74rem;margin-left:8px}
  .submit-row{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:8px 0 18px}
  .lockbadge{display:inline-flex;align-items:center;gap:5px;font-size:.85rem;color:var(--lock);font-weight:700}
  .submitbtn{background:var(--win);color:#001219;border-color:var(--win);font-weight:700}
  .submitbtn:hover{background:#34c2b0;border-color:#34c2b0;color:#001219}
  .unlockbtn{border-color:var(--gold);color:var(--gold)}
  .unlockbtn:hover{background:var(--gold);color:#001219;border-color:var(--gold)}
  .match{display:grid;grid-template-columns:32px 1fr auto 1fr 130px;align-items:center;gap:8px;background:var(--card);padding:9px 12px;border-radius:10px;margin-bottom:7px}
  .match.locked{opacity:.55}
  .match.finalmatch{border:1px solid var(--gold)}
  .num{color:var(--muted);font-size:.78rem;text-align:center}
  .team{font-weight:600}
  .home{text-align:right}.away{text-align:left}
  .code{color:var(--muted);font-weight:400;font-size:.78rem}
  .meta{font-size:.7rem;color:var(--muted);display:block;font-weight:400}
  .meta .dblpill{color:var(--gold);font-weight:700}
  .score{display:flex;align-items:center;gap:6px;justify-content:center;flex-direction:column}
  .scoreline{display:flex;align-items:center;gap:6px}
  .score input{width:44px;text-align:center;font-size:1.05rem;padding:6px;background:#0d1b2a;border:1px solid #415a77;color:var(--text);border-radius:6px}
  .score input:focus{outline:2px solid var(--accent)}
  .score input:disabled,.prog:disabled{background:#16202e;color:var(--muted);cursor:not-allowed}
  .prog{font-size:.72rem;padding:3px;background:#0d1b2a;border:1px solid #415a77;color:var(--text);border-radius:6px;max-width:140px}
  .result{font-size:.7rem;text-align:center;padding:4px 6px;border-radius:6px;background:#0d1b2a;color:var(--muted);min-width:120px}
  .result.home,.result.away{background:var(--win);color:#001219;font-weight:700}
  .result.draw{background:var(--draw);color:#001219;font-weight:700}
  .result.pts{background:var(--gold);color:#001219;font-weight:700}
  .lbwrap{overflow-x:auto}
  table.lb{width:100%;max-width:1060px;margin:0 auto;border-collapse:collapse;font-size:.86rem}
  table.lb th,table.lb td{padding:9px 10px;text-align:center;border-bottom:1px solid #415a77;white-space:nowrap}
  table.lb th{color:var(--accent);font-size:.78rem}
  table.lb td.name{text-align:left;font-weight:600}
  table.lb td.total{font-weight:700;color:var(--gold);background:#15263b}
  table.lb th.total{color:var(--gold);background:#15263b}
  table.lb td.perfect,table.lb th.perfect{color:var(--win);font-weight:700}
  table.lb td.rank{color:var(--muted);width:36px}
  table.lb tr:first-child td.rank{color:var(--gold);font-size:1.05rem}
  .hint{max-width:1060px;margin:8px auto;color:var(--muted);font-size:.8rem;text-align:center}
  .admin-note{background:#3d2c1b;border:1px solid var(--draw);color:var(--draw);padding:8px 12px;border-radius:8px;max-width:920px;margin:0 auto 12px;font-size:.82rem;text-align:center}
  .missing-note{background:#3d1f1b;border:1px solid var(--danger);color:#ffb4a2;padding:10px 14px;border-radius:8px;max-width:920px;margin:0 auto 12px;font-size:.82rem}
  .missing-note b{color:#fff}
  .third-panel{background:var(--card);border:1px solid #415a77;border-radius:12px;padding:14px 18px;max-width:920px;margin:0 auto 16px}
  .third-panel h3{margin:0 0 4px;color:var(--accent);font-size:.95rem}
  .third-panel .pdesc{color:var(--muted);font-size:.78rem;margin-bottom:12px}
  .third-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px 20px}
  .third-row{display:flex;align-items:center;gap:12px}
  .third-row label{font-size:.82rem;color:var(--text);font-weight:600;min-width:96px;text-align:right;flex-shrink:0}
  .third-row select{flex:1;min-width:0;font-size:.8rem;padding:6px}
  .chart-card{background:var(--card);border-radius:12px;padding:14px 16px;max-width:1060px;margin:0 auto 18px}
  .chart-card h3{margin:0 0 4px;color:var(--accent);font-size:1rem}
  .chart-card .pdesc{color:var(--muted);font-size:.78rem;margin-bottom:8px}
  .legend-chart{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px;font-size:.76rem}
  .legend-chart .li{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
  .legend-chart .ln{width:16px;height:3px;border-radius:2px;display:inline-block}
  .summary-wrap{max-width:1060px;margin:0 auto 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .scard{background:var(--card);border-radius:12px;padding:12px 14px;border-left:4px solid var(--accent)}
  .scard h4{margin:0 0 6px;font-size:.95rem;color:var(--text)}
  .scard h4 .badge{font-size:.72rem;color:var(--muted);font-weight:400}
  .scard p{margin:0;font-size:.82rem;color:var(--muted);line-height:1.45}
  .scard .stat{color:var(--gold);font-weight:700}
  .groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;max-width:1100px;margin:0 auto}
  .gcard{background:var(--card);border-radius:12px;padding:10px 12px}
  .gcard h3{margin:2px 0 8px;color:var(--accent);font-size:1rem}
  table.gt{width:100%;border-collapse:collapse;font-size:.82rem}
  table.gt th{color:var(--muted);font-weight:600;text-align:center;padding:4px 3px;border-bottom:1px solid #415a77}
  table.gt td{padding:5px 3px;text-align:center;border-bottom:1px solid #2a3a52}
  table.gt td.tname{text-align:left;font-weight:600}
  table.gt td.pos{color:var(--muted);width:22px}
  table.gt tr.q1 td.pos,table.gt tr.q2 td.pos{color:var(--qual);font-weight:700}
  table.gt tr.q1 td.tname,table.gt tr.q2 td.tname{border-left:3px solid var(--qual);padding-left:6px}
  table.gt tr.q3 td.tname{border-left:3px solid var(--third);padding-left:6px}
  table.gt td.pts{font-weight:700;color:var(--gold)}
  .legend{max-width:1100px;margin:14px auto 0;color:var(--muted);font-size:.78rem;text-align:center}
  .legend span{display:inline-block;margin:0 8px}
  .swatch{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:4px}
  /* all-predictions matrix, per round */
  .round-block{max-width:100%;margin:0 auto 16px}
  .round-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
  .round-head .rh-title{background:var(--accent);color:#001219;padding:6px 12px;border-radius:8px;font-weight:700;font-size:.92rem}
  .round-head .rh-title.open{background:var(--win)}
  .round-head .rh-actions{display:flex;gap:8px;align-items:center}
  .lockstate{font-size:.78rem;color:var(--muted)}
  .lockstate b{color:var(--text)}
  .err-inline{background:#3d1f1b;border:1px solid var(--danger);color:#ffb4a2;padding:8px 12px;border-radius:8px;font-size:.8rem;margin:0 0 10px}
  .err-inline b{color:#fff}
  .matrixwrap{overflow-x:auto;max-width:100%;border:1px solid #2a3a52;border-radius:10px}
  table.matrix{border-collapse:separate;border-spacing:0;font-size:.8rem;width:max-content;min-width:100%}
  table.matrix th,table.matrix td{padding:7px 9px;text-align:center;border-bottom:1px solid #2a3a52;white-space:nowrap}
  table.matrix thead th{position:sticky;top:0;background:#15263b;color:var(--accent);z-index:3;font-size:.76rem}
  table.matrix .gamecol{position:sticky;left:0;background:var(--card);text-align:left;z-index:2;min-width:172px;max-width:172px;box-shadow:1px 0 0 #2a3a52}
  table.matrix thead th.gamecol{z-index:4;background:#15263b}
  table.matrix .gamecol .g-teams{font-weight:600;font-size:.8rem;white-space:normal}
  table.matrix .gamecol .g-meta{color:var(--muted);font-size:.68rem}
  table.matrix td.cell{font-variant-numeric:tabular-nums}
  table.matrix td.cell.empty{color:#43526a}
  table.matrix td.cell .thru{color:var(--accent);font-size:.66rem;display:block}
  table.matrix tr:nth-child(even) td:not(.gamecol){background:rgba(255,255,255,.015)}
  @media(max-width:640px){
    .match{grid-template-columns:28px 1fr auto 1fr}.result{grid-column:1/-1}.third-row label{min-width:80px}
    table.matrix .gamecol{min-width:120px;max-width:120px}
    table.matrix th,table.matrix td{padding:6px 7px}
  }
</style>
</head>

  {key:"sf",label:"Semi-final",test:n=>n>=101&&n<=102},
  {key:"tp",label:"Play-off for third place",test:n=>n===103},
  {key:"fin",label:"Final",test:n=>n===104}
];
const roundOf=n=>ROUNDS.find(r=>r.test(n));
const FILTERS=[{val:"",label:"All stages",test:()=>true}].concat(ROUNDS.map(r=>({val:r.key,label:r.label,test:r.test})));
const BUCKETS=[
  {key:"g1",label:"G1–24",test:n=>n>=1&&n<=24},
  {key:"g2",label:"G25–48",test:n=>n>=25&&n<=48},
  {key:"g3",label:"G49–72",test:n=>n>=49&&n<=72},
  {key:"r32",label:"R32",test:n=>n>=73&&n<=88},
  {key:"r16",label:"R16",test:n=>n>=89&&n<=96},
  {key:"qf",label:"QF",test:n=>n>=97&&n<=100},
  {key:"sf",label:"SF",test:n=>n>=101&&n<=102},
  {key:"tp",label:"3rd Pl",test:n=>n===103},
  {key:"fin",label:"Final ×2",test:n=>n===104}
];
const SERIES_COLORS=["#00b4d8","#ffd166","#2a9d8f","#e76f51","#e9c46a","#9b5de5","#f15bb5","#00bbf9","#80ed99","#ff8fab","#c77dff","#fee440"];

const STORE="wc2026game";
let data=JSON.parse(localStorage.getItem(STORE)||"{}");
data.players=data.players||DEFAULT_PLAYERS.slice();
data.preds=data.preds||{};
data.results=data.results||{};
data.thirds=data.thirds||{};
data.locks=data.locks||{};
data.pins=data.pins||{};
data.players.forEach(p=>{data.preds[p]=data.preds[p]||{};data.locks[p]=data.locks[p]||{};});
function save(){localStorage.setItem(STORE,JSON.stringify(data));}

let view={mode:"results"};
let missingNote=null;
let revealed={};                 // revealed[player]=true (player-tab gate, session)
let matrixRevealed={};           // matrixRevealed[roundKey]=true (All-Predictions per-round reveal, session)
let matrixErr={};                // matrixErr[roundKey]="..." inline error per round (session)

const adminTabs=document.getElementById("adminTabs");
const playerTabs=document.getElementById("playerTabs");

const newPlayerName=document.getElementById("newPlayerName");
const clearBtn=document.getElementById("clearResultsBtn");

FILTERS.forEach(f=>{const o=document.createElement("option");o.value=f.val;o.textContent=f.label;stageFilter.appendChild(o);});

function buildTabs(){
  adminTabs.innerHTML="";playerTabs.innerHTML="";
  const mk=(mode,label)=>{
    const t=document.createElement("div");
    t.className="tab"+(view.mode===mode?" active":"");
    t.textContent=label;t.onclick=()=>{view={mode};missingNote=null;render();};adminTabs.appendChild(t);
  };
  mk("results","🎯 Results");
  mk("groups","📊 Group Tables");
  mk("matrix","🗒 All Predictions");
  mk("leaderboard","🏆 Leaderboard");
  data.players.forEach(p=>{
    const b=document.createElement("div");
    b.className="tab"+(view.mode==="player"&&view.player===p?" active":"");
    const nameSpan=document.createElement("span");

    nameSpan.onclick=()=>{view={mode:"player",player:p};missingNote=null;render();};
    b.appendChild(nameSpan);
    const rm=document.createElement("span");rm.className="rm";rm.textContent="×";rm.title="Remove "+p;
    rm.onclick=e=>{e.stopPropagation();removePlayer(p);};

  });

  add.onclick=()=>{addBox.style.display="flex";newPlayerName.value="";newPlayerName.focus();};
  playerTabs.appendChild(add);
  clearBtn.style.display=view.mode==="results"?"":"none";
}

function addPlayer(rawName){
  const name=(rawName||"").trim();
  if(!name){alert("Please enter a name.");return false;}
  if(data.players.some(p=>p.toLowerCase()===name.toLowerCase())){alert("A player called \""+name+"\" already exists.");return false;}
  data.players.push(name);data.preds[name]=data.preds[name]||{};data.locks[name]=data.locks[name]||{};save();
  addBox.style.display="none";view={mode:"player",player:name};render();return true;
}
function removePlayer(name){
  if(!confirm("Remove player \""+name+"\" and all their predictions? This cannot be undone (unless you re-import a backup).")) return;
  data.players=data.players.filter(p=>p!==name);delete data.preds[name];delete data.locks[name];delete data.pins[name];delete revealed[name];save();
  if(view.mode==="player"&&view.player===name)view={mode:"leaderboard"};render();
}
function clearAllResults(){
  if(!confirm("Clear ALL entered results (scores, pens winners, and 3rd-place assignments)? Player predictions, PINs and locks are kept. This cannot be undone unless you re-import a backup.")) return;
  data.results={};data.thirds={};save();render();alert("All results cleared ✅");
}

function missingForRound(player,round){
  const items=[];
  FIXTURES.forEach(f=>{
    const num=f[0];if(!round.test(num))return;
    const rec=data.preds[player][num]||{h:"",a:"",prog:""};
    const probs=[];
    if(rec.h==="")probs.push("home score");
    if(rec.a==="")probs.push("away score");
    if(isKO(num)&&rec.h!==""&&rec.a!==""&&(+rec.h===+rec.a)&&!rec.prog)probs.push("who goes through (draw)");
    if(probs.length)items.push("Match "+num+": "+probs.join(", "));
  });
  return items;
}
function submitRound(player,round){
  const missing=missingForRound(player,round);
  if(missing.length){missingNote={round:round.key,items:missing};render();return;}
  if(confirm("Are you really sure?\n\nThese predictions for \""+round.label+"\" will be LOCKED and "+player+" cannot change them.\n\nClick OK to lock, or Cancel to keep editing.")){
    data.locks[player][round.key]=true;missingNote=null;save();render();
  }
}
function unlockRound(player,round){
  const pw=prompt("Admin unlock — enter password to unlock \""+round.label+"\" for "+player+":");
  if(pw===null)return;
  if(pw===ADMIN_PASSWORD){data.locks[player][round.key]=false;save();render();}
  else{alert("Incorrect password.");}
}
// who has NOT locked a given round
function playersNotLocked(round){
  return data.players.filter(p=>!(data.locks[p]&&data.locks[p][round.key]));
}

function scoreMatch(pred,res,ko,num){
  if(!pred||!res)return null;
  if(pred.h===""||pred.a===""||res.h===""||res.a==="")return null;
  const ph=+pred.h,pa=+pred.a,rh=+res.h,ra=+res.a;
  let pts=0,resultOK;
  if(ko){let ap=rh>ra?"H":ra>rh?"A":(res.pen||"");let pp=ph>pa?"H":pa>ph?"A":(pred.prog||"");resultOK=pp!==""&&pp===ap;}
  else{const pr=ph>pa?"H":pa>ph?"A":"D";const rr=rh>ra?"H":ra>rh?"A":"D";resultOK=pr===rr;}
  const homeOK=ph===rh,awayOK=pa===ra;
  if(resultOK)pts+=2;if(homeOK)pts+=2;if(awayOK)pts+=2;
  if(resultOK&&homeOK&&awayOK)pts+=2;
  if(num===FINAL_MATCH)pts*=2;
  return pts;
}

function computeGroups(){
  const groups={};
  FIXTURES.forEach(f=>{const[num,,,home,away,fstage,group]=f;if(isKO(num)||!group)return;
    groups[group]=groups[group]||{};
    [home,away].forEach(t=>{groups[group][t]=groups[group][t]||{team:t,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0};});});
  FIXTURES.forEach(f=>{const[num,,,home,away,fstage,group]=f;if(isKO(num)||!group)return;
    const r=data.results[num];if(!r||r.h===""||r.a==="")return;
    const rh=+r.h,ra=+r.a,H=groups[group][home],A=groups[group][away];
    H.P++;A.P++;H.GF+=rh;H.GA+=ra;A.GF+=ra;A.GA+=rh;
    if(rh>ra){H.W++;A.L++;H.Pts+=3;}else if(ra>rh){A.W++;H.L++;A.Pts+=3;}else{H.D++;A.D++;H.Pts++;A.Pts++;}});
  const out={};
  Object.keys(groups).sort().forEach(g=>{const arr=Object.values(groups[g]);arr.forEach(t=>t.GD=t.GF-t.GA);
    arr.sort((a,b)=>b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF||a.team.localeCompare(b.team));out[g]=arr;});
  return out;
}
function resolveCode(code){
  if(!code)return null;
  let m=code.match(/^([12])([A-L])$/);
  if(m){const pos=+m[1]-1,grp=m[2],table=computeGroups()[grp];if(!table)return null;
    if(!table.every(t=>t.P>=3))return null;return table[pos]?table[pos].team:null;}
  if(/^3[A-L]+$/.test(code))return data.thirds[code]||null;
  m=code.match(/^W(\d+)$/);
  if(m){const mn=+m[1],r=data.results[mn];if(!r||r.h===""||r.a==="")return null;
    const rh=+r.h,ra=+r.a,f=FIXTURES.find(x=>x[0]===mn);let winSide=rh>ra?"H":ra>rh?"A":(r.pen||"");
    if(winSide==="")return null;return resolveTeam(winSide==="H"?f[3]:f[4]);}
  m=code.match(/^RU(\d+)$/);
  if(m){const mn=+m[1],r=data.results[mn];if(!r||r.h===""||r.a==="")return null;
    const rh=+r.h,ra=+r.a,f=FIXTURES.find(x=>x[0]===mn);let loseSide=rh>ra?"A":ra>rh?"H":(r.pen==="H"?"A":r.pen==="A"?"H":"");
    if(loseSide==="")return null;return resolveTeam(loseSide==="H"?f[3]:f[4]);}
  return null;
}
function isCode(s){return /^([12][A-L]|3[A-L]+|W\d+|RU\d+)$/.test(s);}
function resolveTeam(c){return isCode(c)?resolveCode(c):c;}
function displayTeam(c){const r=resolveTeam(c);if(r&&r!==c)return{name:r,code:c};if(isCode(c))return{name:null,code:c};return{name:c,code:null};}
function thirdPlacedTeams(){const groups=computeGroups(),out={};Object.keys(groups).forEach(g=>{if(groups[g][2])out[g]=groups[g][2].team;});return out;}

function renderThirdPanel(){
  const thirds=thirdPlacedTeams();let rows="";
  THIRD_SLOTS.forEach(slot=>{
    const allowedGroups=slot.slice(1).split("");
    const opts=allowedGroups.map(g=>{const t=thirds[g];if(!t)return "";
      const sel=data.thirds[slot]===t?" selected":"";return `<option value="${t}"${sel}>${t} (3rd ${g})</option>`;}).join("");
    rows+=`<div class="third-row"><label>${slot}</label>
      <select data-slot="${slot}"><option value="">— pick 3rd-placed team —</option>${opts}</select></div>`;
  });
  return `<div class="third-panel"><h3>Assign 3rd-placed teams to Round of 32</h3>
    <div class="pdesc">Each slot only lists the 3rd-placed team from its eligible groups. Pick the eight that qualify. Fixtures below update automatically.</div>
    <div class="third-grid">${rows}</div></div>`;
}

function renderGate(player){
  contextLabel.textContent="Locked — enter PIN to view "+player+"'s predictions";
  const hasPin=!!data.pins[player];
  content.innerHTML=`<div class="gate">
    <h3>🔒 ${player}'s predictions</h3>
    <p>${hasPin?"Enter the PIN to view and edit these predictions.":"No PIN set yet."}</p>
    ${hasPin?`<div><input type="password" id="pinInput" maxlength="12" placeholder="PIN" autocomplete="off"></div>
      <div><button class="go" id="pinGo">Unlock</button></div>
      <div class="err" id="pinErr"></div>`:""}
    <div class="setpin">
      <div style="margin-bottom:6px">${hasPin?"Change PIN:":"Set a PIN for "+player+":"}</div>
      <input type="text" id="newPin" maxlength="12" placeholder="New PIN" autocomplete="off" style="width:120px">
      <button id="savePin">${hasPin?"Change PIN":"Set PIN"}</button>
    </div>
  </div>`;
  const go=document.getElementById("pinGo");
  if(go){
    const attempt=()=>{const v=document.getElementById("pinInput").value.trim();
      if(v===data.pins[player]||v===ADMIN_PASSWORD){revealed[player]=true;render();}
      else{document.getElementById("pinErr").textContent="Incorrect PIN.";}};
    go.onclick=attempt;
    document.getElementById("pinInput").addEventListener("keydown",e=>{if(e.key==="Enter")attempt();});
    document.getElementById("pinInput").focus();
  }
  document.getElementById("savePin").onclick=()=>{
    const np=document.getElementById("newPin").value.trim();
    if(np.length<3){alert("Please choose a PIN of at least 3 characters.");return;}
    if(hasPin){const cur=prompt("Enter the CURRENT PIN (or admin password) to change it:");
      if(cur===null)return;if(cur!==data.pins[player]&&cur!==ADMIN_PASSWORD){alert("Incorrect current PIN.");return;}}
    data.pins[player]=np;save();
    alert("PIN saved for "+player+". Keep it safe — recovery only via admin password ("+ADMIN_PASSWORD+").");
    revealed[player]=true;render();
  };
}
function managePin(player){
  const hasPin=!!data.pins[player];
  if(hasPin){const cur=prompt("Enter the CURRENT PIN (or admin password) to change it:");
    if(cur===null)return;if(cur!==data.pins[player]&&cur!==ADMIN_PASSWORD){alert("Incorrect.");return;}}
  const np=prompt((hasPin?"Enter a NEW PIN for ":"Set a PIN for ")+player+" (≥3 chars). Blank & OK removes the PIN:");
  if(np===null)return;const v=np.trim();
  if(v===""){if(hasPin&&confirm("Remove the PIN for "+player+"?")){delete data.pins[player];save();render();}return;}
  if(v.length<3){alert("PIN must be at least 3 characters.");return;}
  data.pins[player]=v;revealed[player]=true;save();render();
}

function render(){
  buildTabs();
  if(view.mode==="leaderboard"){renderLeaderboard();return;}
  if(view.mode==="groups"){renderGroups();return;}
  if(view.mode==="matrix"){renderMatrix();return;}
  if(view.mode==="player"&&!data.players.includes(view.player)){view={mode:"leaderboard"};renderLeaderboard();return;}
  const isResults=view.mode==="results";
  const player=isResults?null:view.player;
  if(!isResults&&data.pins[player]&&!revealed[player]){renderGate(player);return;}
  contextLabel.textContent=isResults?"Entering ACTUAL results":"Predictions for: "+player;
  const filter=FILTERS.find(f=>f.val===stageFilter.value)||FILTERS[0];
  const q=search.value.trim().toLowerCase();
  let html="";
  if(!isResults){
    const pinLabel=data.pins[player]?"🔒 Change PIN":"🔓 Set PIN (private)";
    html+=`<div class="player-toolbar"><button id="managePin">${pinLabel}</button>
      ${data.pins[player]?`<button class="relock" id="relockBtn">Hide / re-lock</button>`:""}</div>`;
  }
  if(isResults){
    html+=`<div class="admin-note">🎯 Admin: enter the real results here. For knockout draws, also pick who won on penalties.</div>`;
    html+=renderThirdPanel();
  }
  let lastRoundKey=null,done=0,total=0,openRound=null;
  function closeRoundFooter(round){
    if(!round||isResults)return "";
    const locked=data.locks[player]&&data.locks[player][round.key];
    if(locked){return `<div class="submit-row"><span class="lockbadge">🔒 "${round.label}" locked</span>
      <button class="unlockbtn" data-unlock="${round.key}">🔓 Unlock (admin)</button></div>`;}
    let note="";
    if(missingNote&&missingNote.round===round.key){
      note=`<div class="missing-note"><b>Can't lock "${round.label}" yet — these predictions are missing:</b><br>${missingNote.items.join("<br>")}</div>`;}
    return `${note}<div class="submit-row"><button class="submitbtn" data-submit="${round.key}">✅ Submit &amp; lock "${round.label}"</button></div>`;
  }
  FIXTURES.forEach(f=>{
    const[num,date,ko,homeCode,awayCode,fstage,group]=f;
    if(!filter.test(num))return;
    const round=roundOf(num);const isFinal=num===FINAL_MATCH;
    const locked=!isResults&&data.locks[player]&&data.locks[player][round.key];
    const resolveNames=isResults;
    const homeD=resolveNames?displayTeam(homeCode):{name:(isCode(homeCode)?null:homeCode),code:(isCode(homeCode)?homeCode:null)};
    const awayD=resolveNames?displayTeam(awayCode):{name:(isCode(awayCode)?null:awayCode),code:(isCode(awayCode)?awayCode:null)};
    const homeLabel=homeD.name?homeD.name+(homeD.code?` <span class="code">(${homeD.code})</span>`:""):`<span class="code">${homeD.code}</span>`;
    const awayLabel=awayD.name?awayD.name+(awayD.code?` <span class="code">(${awayD.code})</span>`:""):`<span class="code">${awayD.code}</span>`;
    const homeName=homeD.name||homeCode, awayName=awayD.name||awayCode;
    if(q){const hay=(homeName+" "+awayName+" "+homeCode+" "+awayCode).toLowerCase();if(!hay.includes(q))return;}
    total++;
    const knockout=isKO(num);
    let rec=isResults?(data.results[num]||{h:"",a:"",pen:""}):(data.preds[player][num]||{h:"",a:"",prog:""});
    if(rec.h!==""&&rec.a!=="")done++;
    if(round.key!==lastRoundKey){
      if(openRound)html+=closeRoundFooter(openRound);
      lastRoundKey=round.key;openRound=round;
      const dbl=isFinal?`<span class="dbl">POINTS ×2</span>`:"";
      html+=`<div class="stage-row"><div class="stage-title${locked?" locked":""}">${round.label}${dbl}</div></div>`;
    }
    const groupTxt=group?"Group "+group+" · ":"";
    let label="—",cls="result";
    if(rec.h!==""&&rec.a!==""){
      const h=+rec.h,a=+rec.a;
      if(isResults){
        if(h>a){label=homeName+" win";cls="result home";}
        else if(a>h){label=awayName+" win";cls="result away";}
        else{label="Draw"+(rec.pen?" · "+(rec.pen==="H"?homeName:awayName)+" (pens)":"");cls="result draw";}
      }else{
        const pts=scoreMatch(rec,data.results[num],knockout,num);
        if(pts!==null){label=pts+" pts";cls="result pts";}
        else{
          if(h>a){label=homeName+" win";cls="result home";}
          else if(a>h){label=awayName+" win";cls="result away";}
          else{label="Draw"+(rec.prog?" · "+(rec.prog==="H"?homeName:awayName)+" thru":"");cls="result draw";}
        }
      }
    }
    const dis=locked?" disabled":"";
    let pickHtml="";
    if(knockout){
      const field=isResults?"pen":"prog";const val=rec[field]||"";
      const lbl=isResults?"Pens winner":"Who goes through";
      pickHtml=`<select class="prog" data-num="${num}" data-field="${field}"${dis} title="${lbl}">
        <option value="">${lbl}…</option>
        <option value="H"${val==="H"?" selected":""}>${homeName}</option>
        <option value="A"${val==="A"?" selected":""}>${awayName}</option></select>`;
    }
    const dblPill=isFinal?` · <span class="dblpill">points ×2</span>`:"";
    html+=`<div class="match${locked?" locked":""}${isFinal?" finalmatch":""}">
      <div class="num">#${num}</div>
      <div class="team home">${homeLabel}<span class="meta">${groupTxt}${date} · ${ko}${knockout?" · KO":""}${dblPill}</span></div>
      <div class="score"><div class="scoreline">
        <input type="number" min="0" max="99" data-num="${num}" data-side="h" value="${rec.h}"${dis}>
        <span>–</span>
        <input type="number" min="0" max="99" data-num="${num}" data-side="a" value="${rec.a}"${dis}>
      </div>${pickHtml}</div>
      <div class="team away">${awayLabel}</div>
      <div class="${cls}">${label}</div>
    </div>`;
  });
  if(openRound)html+=closeRoundFooter(openRound);
  contextLabel.textContent+=` · ${done}/${total} entered`;
  content.innerHTML=html;
  const mp=document.getElementById("managePin");if(mp)mp.onclick=()=>managePin(player);
  const rl=document.getElementById("relockBtn");if(rl)rl.onclick=()=>{revealed[player]=false;render();};
}

function renderGroups(){
  contextLabel.textContent="Live group standings (from actual results)";
  const groups=computeGroups();let html=`<div class="groups">`;
  Object.keys(groups).forEach(g=>{
    let rows="";
    groups[g].forEach((t,i)=>{const cls=i===0?"q1":i===1?"q2":i===2?"q3":"";
      rows+=`<tr class="${cls}"><td class="pos">${i+1}</td><td class="tname">${t.team}</td>
        <td>${t.P}</td><td>${t.W}</td><td>${t.D}</td><td>${t.L}</td>
        <td>${t.GF}</td><td>${t.GA}</td><td>${t.GD>0?"+":""}${t.GD}</td><td class="pts">${t.Pts}</td></tr>`;});
    html+=`<div class="gcard"><h3>Group ${g}</h3><table class="gt">
      <tr><th></th><th style="text-align:left">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>
      ${rows}</table></div>`;});
  html+=`</div><div class="legend">
    <span><span class="swatch" style="background:var(--qual)"></span>Top 2 — qualify automatically</span>
    <span><span class="swatch" style="background:var(--third)"></span>3rd — assign to Round of 32 in the Results tab</span>
  </div><div class="hint">Ranking: Points → Goal Difference → Goals For → alphabetical. Updates as you enter results.</div>`;
  content.innerHTML=html;
}

// ---------- ALL PREDICTIONS, gated per round ----------
function renderMatrix(){
  contextLabel.textContent="All Predictions — locked per round until everyone has submitted";
  const q=search.value.trim().toLowerCase();
  const filter=FILTERS.find(f=>f.val===stageFilter.value)||FILTERS[0];
  let html="";
  // show only rounds that pass the stage filter (filter by any match in the round)
  ROUNDS.forEach(round=>{
    const roundMatches=FIXTURES.filter(f=>round.test(f[0])&&filter.test(f[0]));
    if(!roundMatches.length)return;
    const notLocked=playersNotLocked(round);
    const everyoneLocked=notLocked.length===0;
    const open=!!matrixRevealed[round.key];
    const lockTxt=everyoneLocked?`<b>${data.players.length}/${data.players.length}</b> locked`
      :`<b>${data.players.length-notLocked.length}/${data.players.length}</b> locked`;
    let actions;
    if(open){
      actions=`<span class="lockstate">🔓 Revealed</span>
        <button class="unlockbtn" data-mxhide="${round.key}">Hide again</button>`;
    }else{
      actions=`<span class="lockstate">${lockTxt}</span>
        <button class="unlockbtn" data-mxunlock="${round.key}">🔓 Unlock round</button>`;
    }
    html+=`<div class="round-block">
      <div class="round-head">
        <div class="rh-title${open?" open":""}">${round.label}${round.key==="fin"?" — points ×2":""}</div>
        <div class="rh-actions">${actions}</div>
      </div>`;
    if(matrixErr[round.key]){
      html+=`<div class="err-inline"><b>Not everyone has locked "${round.label}" yet.</b><br>Waiting on: ${matrixErr[round.key]}</div>`;
    }
    if(open){
      // build matrix for this round
      let head=`<tr><th class="gamecol">Game</th>`;
      data.players.forEach(p=>head+=`<th>${p}</th>`);head+=`</tr>`;
      let body="";
      roundMatches.forEach(f=>{
        const[num,date,ko,homeCode,awayCode,fstage,group]=f;
        const hN=resolveTeam(homeCode)||homeCode,aN=resolveTeam(awayCode)||awayCode;
        if(q){const hay=(hN+" "+aN+" "+homeCode+" "+awayCode).toLowerCase();if(!hay.includes(q))return;}
        let cells="";
        data.players.forEach(p=>{
          const rec=data.preds[p][num];
          if(!rec||rec.h===""||rec.a===""){cells+=`<td class="cell empty">–</td>`;}
          else{
            let thru="";
            if(isKO(num)&&(+rec.h===+rec.a)&&rec.prog)thru=`<span class="thru">▸ ${rec.prog==="H"?hN:aN}</span>`;
            cells+=`<td class="cell">${rec.h}–${rec.a}${thru}</td>`;
          }
        });
        body+=`<tr><td class="gamecol"><div class="g-teams">${hN} v ${aN}</div>
          <div class="g-meta">#${num} · ${date}${group?" · Grp "+group:""}</div></td>${cells}</tr>`;
      });
      html+=`<div class="matrixwrap"><table class="matrix"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
    }
    html+=`</div>`;
  });
  html+=`<div class="hint">Each round stays hidden until <b>every player has locked</b> their predictions for it, then needs the admin password to reveal. <b>X–Y</b> = predicted score; <span style="color:var(--accent)">▸ Team</span> = pick to progress on a knockout draw.</div>`;
  content.innerHTML=html;
}

function matrixUnlock(roundKey){
  const round=ROUNDS.find(r=>r.key===roundKey);
  matrixErr={}; // clear prior errors
  const notLocked=playersNotLocked(round);
  if(notLocked.length){
    matrixErr[roundKey]=notLocked.join(", ");
    render();return;
  }
  const pw=prompt("All players have locked \""+round.label+"\".\nEnter the admin password to reveal everyone's predictions:");
  if(pw===null)return;
  if(pw===ADMIN_PASSWORD){matrixRevealed[roundKey]=true;render();}
  else{alert("Incorrect password.");}
}

function computeStats(){
  return data.players.map(p=>{
    const b={};BUCKETS.forEach(x=>b[x.key]=0);
    let total=0,scored=0,perfect=0,resultHits=0,homeHits=0,awayHits=0;
    FIXTURES.forEach(f=>{
      const num=f[0];const pred=data.preds[p][num],res=data.results[num];
      const s=scoreMatch(pred,res,isKO(num),num);
      if(s!==null){
        total+=s;scored++;const bk=BUCKETS.find(x=>x.test(num));if(bk)b[bk.key]+=s;
        const maxForMatch=num===FINAL_MATCH?16:8;if(s===maxForMatch)perfect++;
        const ph=+pred.h,pa=+pred.a,rh=+res.h,ra=+res.a;
        let resultOK;
        if(isKO(num)){let ap=rh>ra?"H":ra>rh?"A":(res.pen||"");let pp=ph>pa?"H":pa>ph?"A":(pred.prog||"");resultOK=pp!==""&&pp===ap;}
        else{const pr=ph>pa?"H":pa>ph?"A":"D";const rr=rh>ra?"H":ra>rh?"A":"D";resultOK=pr===rr;}
        if(resultOK)resultHits++;if(ph===rh)homeHits++;if(pa===ra)awayHits++;
      }
    });
    const avg=scored?total/scored:0;
    return{player:p,total,scored,perfect,avg,resultHits,homeHits,awayHits,b};
  }).sort((a,b)=>b.total-a.total);
}
function cumulativeSeries(stat){let run=0;return BUCKETS.map(x=>{run+=stat.b[x.key]||0;return run;});}
function buildChartSVG(stats){
  const W=1000,H=320,padL=44,padR=16,padT=18,padB=46;
  const xs=BUCKETS.length;
  const maxY=Math.max(10,...stats.map(s=>cumulativeSeries(s).slice(-1)[0]||0));
  const plotW=W-padL-padR,plotH=H-padT-padB;
  const xAt=i=>padL+(xs<=1?0:(plotW*i/(xs-1)));
  const yAt=v=>padT+plotH-(plotH*v/maxY);
  let grid="";const steps=5;
  for(let i=0;i<=steps;i++){const v=Math.round(maxY*i/steps);const y=yAt(v);
    grid+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#2a3a52" stroke-width="1"/>
      <text x="${padL-8}" y="${y+4}" fill="#8d99ae" font-size="11" text-anchor="end">${v}</text>`;}
  let xlab="";BUCKETS.forEach((b,i)=>{const x=xAt(i);
    xlab+=`<text x="${x}" y="${H-padB+20}" fill="#8d99ae" font-size="11" text-anchor="middle">${b.label}</text>`;});
  let lines="";
  stats.forEach((s,si)=>{
    const col=SERIES_COLORS[si%SERIES_COLORS.length];
    const pts=cumulativeSeries(s);
    const d=pts.map((v,i)=>`${i===0?"M":"L"}${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(" ");
    lines+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>`;
    pts.forEach((v,i)=>{lines+=`<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(v).toFixed(1)}" r="3" fill="${col}"/>`;});
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img">${grid}${xlab}${lines}</svg>`;
}
function buildChartLegend(stats){
  return `<div class="legend-chart">`+stats.map((s,si)=>{
    const col=SERIES_COLORS[si%SERIES_COLORS.length];
    return `<span class="li"><span class="ln" style="background:${col}"></span>${s.player}</span>`;
  }).join("")+`</div>`;
}
function buildSummary(stats){
  const anyScored=stats.some(s=>s.scored>0);
  if(!anyScored){
    return `<div class="summary-wrap"><div class="scard" style="grid-column:1/-1;border-left-color:var(--muted)">
      <h4>No results scored yet</h4>
      <p>Enter actual results in the 🎯 Results tab and a performance summary for each player will appear here automatically.</p></div></div>`;
  }
  const leader=stats[0];
  const cards=stats.map((s,i)=>{
    const pos=i+1;const ordinal=pos===1?"1st":pos===2?"2nd":pos===3?"3rd":pos+"th";
    const accuracy=s.scored?Math.round(100*s.resultHits/s.scored):0;
    let blurb;
    if(s.scored===0){blurb=`No scored predictions yet.`;}
    else{
      const gap=leader.total-s.total;
      const lead=i===0?`Out in front on <span class="stat">${s.total}</span> pts.`:`<span class="stat">${gap}</span> pt${gap===1?"":"s"} behind the leader (${leader.player}).`;
      blurb=`${lead} Correct outcome in <span class="stat">${s.resultHits}/${s.scored}</span> games (${accuracy}%), `
        +`nailed the home score <span class="stat">${s.homeHits}</span>× and away score <span class="stat">${s.awayHits}</span>×, `
        +`with <span class="stat">${s.perfect}</span> perfect prediction${s.perfect===1?"":"s"}. `
        +`Averaging <span class="stat">${s.avg.toFixed(1)}</span> pts per scored game.`;
    }
    return `<div class="scard"><h4>${s.player} <span class="badge">— ${ordinal}, ${s.total} pts</span></h4><p>${blurb}</p></div>`;
  }).join("");
  return `<div class="summary-wrap">${cards}</div>`;
}
function renderLeaderboard(){
  contextLabel.textContent="Overall standings, trend & summary";
  const stats=computeStats();
  let header=`<tr><th>#</th><th style="text-align:left">Player</th><th class="total">Total</th>`;
  BUCKETS.forEach(x=>header+=`<th>${x.label}</th>`);header+=`<th class="perfect">Perfect</th></tr>`;
  let rows="";let rank=0,prev=null;
  stats.forEach((t,i)=>{
    if(t.total!==prev){rank=i+1;prev=t.total;}
    let cells="";BUCKETS.forEach(x=>cells+=`<td>${t.b[x.key]||0}</td>`);
    rows+=`<tr><td class="rank">${rank}</td><td class="name">${t.player}</td><td class="total">${t.total}</td>${cells}<td class="perfect">${t.perfect}</td></tr>`;
  });
  const table=`<div class="lbwrap"><table class="lb">${header}${rows}</table></div>
    <div class="hint">Total sits beside the name; stage breakdown across (Final column is doubled). <b>Perfect</b> counts exact-scoreline predictions (Final perfect = 16). Updates automatically as results are entered.</div>`;
  const chart=`<div class="chart-card"><h3>📈 Cumulative points by stage</h3>
    <div class="pdesc">Each line is a player's running total as the tournament progresses (Final points are doubled). Updates automatically as results are entered.</div>
    ${buildChartSVG(stats)}${buildChartLegend(stats)}</div>`;
  const summaryTitle=`<div class="stage-title" style="max-width:1060px;margin:18px auto 10px">📝 How each player is performing</div>`;
  content.innerHTML=table+chart+summaryTitle+buildSummary(stats);
}

content.addEventListener("input",e=>{
  const num=e.target.dataset.num;if(!num)return;
  if(!e.target.dataset.side)return;
  if(e.target.disabled)return;
  const isResults=view.mode==="results";
  const store=isResults?(data.results[num]=data.results[num]||{h:"",a:"",pen:""})
                       :(data.preds[view.player][num]=data.preds[view.player][num]||{h:"",a:"",prog:""});
  store[e.target.dataset.side]=e.target.value;save();
});
content.addEventListener("change",e=>{
  if(e.target.dataset.slot){data.thirds[e.target.dataset.slot]=e.target.value;save();render();return;}
  if(e.target.dataset.field){
    if(e.target.disabled)return;
    const num=e.target.dataset.num;const isResults=view.mode==="results";
    const store=isResults?(data.results[num]=data.results[num]||{h:"",a:"",pen:""})
                         :(data.preds[view.player][num]=data.preds[view.player][num]||{h:"",a:"",prog:""});
    store[e.target.dataset.field]=e.target.value;save();render();
  }
});
content.addEventListener("click",e=>{
  const sub=e.target.dataset.submit, unl=e.target.dataset.unlock;
  const mxU=e.target.dataset.mxunlock, mxH=e.target.dataset.mxhide;
  if(sub&&view.mode==="player"){const round=ROUNDS.find(r=>r.key===sub);submitRound(view.player,round);}
  if(unl&&view.mode==="player"){const round=ROUNDS.find(r=>r.key===unl);unlockRound(view.player,round);}
  if(mxU){matrixUnlock(mxU);}
  if(mxH){delete matrixRevealed[mxH];render();}
});

stageFilter.addEventListener("change",()=>{missingNote=null;render();});
search.addEventListener("input",render);

document.getElementById("addConfirm").onclick=()=>addPlayer(newPlayerName.value);
document.getElementById("addCancel").onclick=()=>{addBox.style.display="none";};
newPlayerName.addEventListener("keydown",e=>{if(e.key==="Enter")addPlayer(newPlayerName.value);if(e.key==="Escape")addBox.style.display="none";});

document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="wc2026-game-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();
};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
clearBtn.onclick=clearAllResults;
document.getElementById("importFile").onchange=e=>{
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const loaded=JSON.parse(r.result);
      if(!loaded.preds||!loaded.results)throw new Error("Not a valid backup file");
      data=loaded;data.players=data.players||DEFAULT_PLAYERS.slice();
      data.preds=data.preds||{};data.results=data.results||{};data.thirds=data.thirds||{};data.locks=data.locks||{};data.pins=data.pins||{};
      data.players.forEach(p=>{data.preds[p]=data.preds[p]||{};data.locks[p]=data.locks[p]||{};});
      revealed={};matrixRevealed={};matrixErr={};
      save();view={mode:"leaderboard"};render();alert("Backup imported successfully ✅");
    }catch(err){alert("Could not import: "+err.message);}
  };
  r.readAsText(file);
};

render();
