<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC2026 — Make Your Predictions</title>
<style>
  :root{--bg:#0d1b2a;--card:#1b263b;--accent:#00b4d8;--win:#2a9d8f;--draw:#e9c46a;--text:#e0e1dd;--muted:#8d99ae;--gold:#ffd166;--danger:#e76f51;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);padding:14px}
  header{text-align:center;margin-bottom:14px}
  h1{margin:0 0 4px;font-size:1.4rem}
  .sub{color:var(--muted);font-size:.85rem}
  .controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:12px 0}
  select,input[type=text],button{background:var(--card);color:var(--text);border:1px solid #415a77;border-radius:8px;padding:8px 12px;font-size:.9rem}
  button{cursor:pointer;transition:.2s}
  button:hover{background:var(--accent);color:#001219;border-color:var(--accent)}
  .entry-name{max-width:560px;margin:0 auto 14px;background:var(--card);border:1px solid #415a77;border-radius:12px;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .entry-name label{font-size:.85rem;color:var(--muted)}
  .entry-name select{flex:1;min-width:160px}
  .stage-row{margin:16px 0 10px}
  .stage-title{background:var(--accent);color:#001219;padding:6px 12px;border-radius:8px;font-weight:700;font-size:.92rem;margin:0;display:inline-block}
  .stage-title .dbl{background:#001219;color:var(--gold);padding:1px 7px;border-radius:6px;font-size:.74rem;margin-left:8px}
  .submit-row{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:8px 0 18px;flex-wrap:wrap}
  .copybtn{background:var(--gold);color:#001219;border-color:var(--gold);font-weight:700}
  .copybtn:hover{background:#ffdf85;border-color:#ffdf85;color:#001219}
  .copyall{background:var(--win);color:#001219;border-color:var(--win);font-weight:700}
  .copyall:hover{background:#34c2b0;border-color:#34c2b0;color:#001219}

  /* --- match card: full-width, stacked rows --- */
  .match{background:var(--card);padding:10px 14px;border-radius:10px;margin-bottom:7px}
  .match.finalmatch{border:1px solid var(--gold)}
  /* top row: home name | score | away name */
  .match-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
  .num{color:var(--muted);font-size:.78rem;font-weight:600}
  .team{font-weight:600;font-size:1rem;line-height:1.2;min-width:0;overflow-wrap:break-word}
  .home{text-align:right}.away{text-align:left}
  .code{color:var(--muted);font-weight:400;font-size:.82rem}
  /* meta line: full width under the top row */
  .meta{display:block;width:100%;text-align:center;margin-top:8px;padding-top:7px;border-top:1px solid #2b3a52;font-size:.72rem;color:var(--muted)}
  .meta .dblpill{color:var(--gold);font-weight:700}
  /* score block */
  .score{display:flex;align-items:center;gap:6px;justify-content:center;flex-direction:column}
  .scoreline{display:flex;align-items:center;gap:8px}
  /* --- stepper styles --- */
  .stepper{display:flex;align-items:center;gap:8px}
  .stepbtn{
    width:32px;height:32px;padding:0;
    font-size:1.2rem;font-weight:700;line-height:1;
    border:none;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    user-select:none;cursor:pointer;transition:.15s;
  }
  /* minus = muted/dark pill */
  .stepbtn.minus{background:#2b3a52;color:var(--text);}
  .stepbtn.minus:hover{background:#3a4d6b;color:#fff;}
  /* plus = accent pill */
  .stepbtn.plus{background:var(--accent);color:#001219;}
  .stepbtn.plus:hover{background:#33c6ec;color:#001219;}
  .stepbtn:active{transform:scale(.9)}
  .scoreval{
    min-width:22px;text-align:center;
    font-size:1.2rem;font-weight:700;
    color:var(--text);background:none;border:none;padding:0;
  }
  .scoreval.empty{color:var(--muted);font-weight:400}
  /* ----------------------- */
  .prog{font-size:.72rem;padding:4px;background:#0d1b2a;border:1px solid #415a77;color:var(--text);border-radius:6px;max-width:160px}
  .result{font-size:.7rem;text-align:center;padding:4px 6px;border-radius:6px;background:#0d1b2a;color:var(--muted);margin-top:8px}
  .result.home,.result.away{background:var(--win);color:#001219;font-weight:700}
  .result.draw{background:var(--draw);color:#001219;font-weight:700}
  .missing-note{background:#3d1f1b;border:1px solid var(--danger);color:#ffb4a2;padding:10px 14px;border-radius:8px;max-width:920px;margin:0 auto 12px;font-size:.82rem}
  .missing-note b{color:#fff}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--win);color:#001219;font-weight:700;padding:10px 18px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .hint{max-width:760px;margin:8px auto;color:var(--muted);font-size:.8rem;text-align:center}
  @media(max-width:640px){
    .match-top{grid-template-columns:1fr auto 1fr;gap:6px}
    .team{font-size:.92rem}
    .scoreline{gap:5px}
    .stepbtn{width:30px;height:30px}
  }
</style>
</head>
<body>
<header>
  <h1>⚽ World Cup 2026 — Your Predictions</h1>
  <div class="sub">Pick your name, fill in your scores, then tap <b>Copy</b> and paste into WhatsApp to send them in.</div>

<div class="hint">Your predictions are saved in this browser automatically. When you're ready, use a <b>Copy</b> button and paste the text into a WhatsApp message to Chris.</div>

];
const FIRST_KO=73;const isKO=n=>n>=FIRST_KO;
const ROUNDS=[
  {key:"fs1",label:"First Stage (1–24)",tag:"FS1",test:n=>n>=1&&n<=24},
  {key:"fs2",label:"First Stage (25–48)",tag:"FS2",test:n=>n>=25&&n<=48},
  {key:"fs3",label:"First Stage (49–72)",tag:"FS3",test:n=>n>=49&&n<=72},
  {key:"r32",label:"Round of 32",tag:"R32",test:n=>n>=73&&n<=88},
  {key:"r16",label:"Round of 16",tag:"R16",test:n=>n>=89&&n<=96},
  {key:"qf",label:"Quarter-final",tag:"QF",test:n=>n>=97&&n<=100},
  {key:"sf",label:"Semi-final",tag:"SF",test:n=>n>=101&&n<=102},
  {key:"tp",label:"Play-off for third place",tag:"3RD",test:n=>n===103},
  {key:"fin",label:"Final",tag:"FINAL",test:n=>n===104}
];
const roundOf=n=>ROUNDS.find(r=>r.test(n));
const FILTERS=[{val:"",label:"All stages",test:()=>true}].concat(ROUNDS.map(r=>({val:r.key,label:r.label,test:r.test})));

const STORE="wc2026predictions";
let data=JSON.parse(localStorage.getItem(STORE)||"{}");
data.name=data.name||"";data.preds=data.preds||{};
function save(){localStorage.setItem(STORE,JSON.stringify(data));}

const content=document.getElementById("content");
const stageFilter=document.getElementById("stageFilter");
const search=document.getElementById("search");
const contextLabel=document.getElementById("contextLabel");
const entryName=document.getElementById("entryName");
const toast=document.getElementById("toast");
let missing=null;

FILTERS.forEach(f=>{const o=document.createElement("option");o.value=f.val;o.textContent=f.label;stageFilter.appendChild(o);});

// populate the name dropdown from saved players
(function buildNameDropdown(){
  const placeholder=document.createElement("option");
  placeholder.value="";placeholder.textContent="— select your name —";
  entryName.appendChild(placeholder);
  PLAYERS.forEach(p=>{const o=document.createElement("option");o.value=p;o.textContent=p;entryName.appendChild(o);});
  // restore previous selection if it's still a valid player
  if(data.name&&PLAYERS.includes(data.name))entryName.value=data.name;
  else{data.name="";save();}
})();

function isCode(s){return /^([12][A-L]|3[A-L]+|W\d+|RU\d+)$/.test(s);}
function label(num){
  const rec=data.preds[num];const f=FIXTURES.find(x=>x[0]===num);
  let lab="—",cls="result";
  if(rec&&rec.h!==""&&rec.a!==""){
    const h=+rec.h,a=+rec.a;
    if(h>a){lab=f[3]+" win";cls="result home";}
    else if(a>h){lab=f[4]+" win";cls="result away";}
    else{lab="Draw"+(rec.prog?" · "+(rec.prog==="H"?f[3]:f[4])+" thru":"");cls="result draw";}
  }
  return{lab,cls};
}
function updateLabel(num){
  const row=content.querySelector('.match[data-matchnum="'+num+'"]');if(!row)return;
  const el=row.querySelector(".result");if(!el)return;
  const{lab,cls}=label(num);el.className=cls;el.textContent=lab;
}

// --- stepper helpers ---
// Adjust a score by delta. Empty starts at 0 then applies delta (clamped 0–99).
function adjustScore(num,side,delta){
  const s=data.preds[num]=data.preds[num]||{h:"",a:"",prog:""};
  let cur=s[side]===""?0:(+s[side]||0);
  cur+=delta;
  if(cur<0)cur=0;if(cur>99)cur=99;
  s[side]=String(cur);
  save();
  updateScoreDisplay(num,side);
  updateLabel(num);
}
function updateScoreDisplay(num,side){
  const row=content.querySelector('.match[data-matchnum="'+num+'"]');if(!row)return;
  const valEl=row.querySelector('.scoreval[data-num="'+num+'"][data-side="'+side+'"]');if(!valEl)return;
  const rec=data.preds[num]||{h:"",a:"",prog:""};
  const v=rec[side];
  valEl.textContent=v===""?"–":v;
  valEl.classList.toggle("empty",v==="");
}

function missingForRound(round){
  const items=[];
  FIXTURES.forEach(f=>{const num=f[0];if(!round.test(num))return;
    const rec=data.preds[num]||{h:"",a:"",prog:""};const probs=[];
    if(rec.h==="")probs.push("home score");
    if(rec.a==="")probs.push("away score");
    if(isKO(num)&&rec.h!==""&&rec.a!==""&&(+rec.h===+rec.a)&&!rec.prog)probs.push("who goes through (draw)");
    if(probs.length)items.push("Match "+num+": "+probs.join(", "));
  });
  return items;
}

function buildText(roundKey){
  const name=(data.name||"").trim()||"(no name)";
  let lines=["WC2026 Predictions — "+name];
  ROUNDS.forEach(round=>{
    if(roundKey&&round.key!==roundKey)return;
    const ms=FIXTURES.filter(f=>round.test(f[0]));
    const any=ms.some(f=>{const r=data.preds[f[0]];return r&&r.h!==""&&r.a!=="";});
    if(!any)return;
    lines.push("["+round.tag+"]");
    ms.forEach(f=>{
      const[num,,,home,away]=f;const r=data.preds[num];
      if(!r||r.h===""||r.a==="")return;
      let line=num+". "+home+" "+r.h+"-"+r.a+" "+away;
      if(isKO(num)&&(+r.h===+r.a)&&r.prog)line+=" > "+(r.prog==="H"?home:away);
      lines.push(line);
    });
  });
  return lines.join("\n");
}

function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopied,()=>fallbackCopy(text));
  }else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand("copy");showCopied();}catch(e){alert("Couldn't auto-copy. Here's your text:\n\n"+text);}
  document.body.removeChild(ta);
}
function showCopied(){toast.textContent="✅ Copied! Now paste into WhatsApp";toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),2200);}

function render(){
  const filter=FILTERS.find(f=>f.val===stageFilter.value)||FILTERS[0];
  const q=search.value.trim().toLowerCase();
  let html="",lastKey=null,openRound=null,done=0,total=0;
  function footer(round){
    if(!round)return "";
    let note="";
    if(missing&&missing.round===round.key)
      note=`<div class="missing-note"><b>"${round.label}" isn't complete — but you can still copy what you've got. Missing:</b><br>${missing.items.join("<br>")}</div>`;
    return `${note}<div class="submit-row"><button class="copybtn" data-copy="${round.key}">📋 Copy "${round.label}"</button></div>`;
  }
  FIXTURES.forEach(f=>{
    const[num,date,ko,home,away,fstage,group]=f;
    if(!filter.test(num))return;
    const round=roundOf(num);const isFinal=num===FINAL_MATCH;
    if(q){const hay=(home+" "+away).toLowerCase();if(!hay.includes(q))return;}
    total++;
    const rec=data.preds[num]||{h:"",a:"",prog:""};
    if(rec.h!==""&&rec.a!=="")done++;
    if(round.key!==lastKey){if(openRound)html+=footer(openRound);lastKey=round.key;openRound=round;
      const dbl=isFinal?`<span class="dbl">POINTS ×2</span>`:"";
      html+=`<div class="stage-row"><div class="stage-title">${round.label}${dbl}</div></div>`;}
    const groupTxt=group?"Group "+group+" · ":"";
    const homeLabel=isCode(home)?`<span class="code">${home}</span>`:home;
    const awayLabel=isCode(away)?`<span class="code">${away}</span>`:away;
    const{lab,cls}=label(num);
    let pick="";
    if(isKO(num)){const v=rec.prog||"";
      pick=`<select class="prog" data-num="${num}" data-field="prog" title="Who goes through">
        <option value="">Who goes through…</option>
        <option value="H"${v==="H"?" selected":""}>${home}</option>
        <option value="A"${v==="A"?" selected":""}>${away}</option></select>`;}
    const dblPill=isFinal?` · <span class="dblpill">points ×2</span>`:"";
    const hDisp=rec.h===""?"–":rec.h, aDisp=rec.a===""?"–":rec.a;
    html+=`<div class="match${isFinal?" finalmatch":""}" data-matchnum="${num}">
      <div class="match-top">
        <div class="team home">${homeLabel}</div>
        <div class="score"><div class="scoreline">
          <span class="stepper">
            <button type="button" class="stepbtn minus" data-step="-1" data-num="${num}" data-side="h" aria-label="Decrease home score">−</button>
            <span class="scoreval${rec.h===""?" empty":""}" data-num="${num}" data-side="h">${hDisp}</span>
            <button type="button" class="stepbtn plus" data-step="1" data-num="${num}" data-side="h" aria-label="Increase home score">+</button>
          </span>
          <span>–</span>
          <span class="stepper">
            <button type="button" class="stepbtn minus" data-step="-1" data-num="${num}" data-side="a" aria-label="Decrease away score">−</button>
            <span class="scoreval${rec.a===""?" empty":""}" data-num="${num}" data-side="a">${aDisp}</span>
            <button type="button" class="stepbtn plus" data-step="1" data-num="${num}" data-side="a" aria-label="Increase away score">+</button>
          </span>
        </div>${pick}</div>
        <div class="team away">${awayLabel}</div>
      </div>
      <div class="meta"><span class="num">#${num}</span> · ${groupTxt}${date} · ${ko}${isKO(num)?" · KO":""}${dblPill}</div>
      <div class="${cls}">${lab}</div>
    </div>`;
  });
  if(openRound)html+=footer(openRound);
  contextLabel.textContent=`${done}/${total} predicted`;
  content.innerHTML=html;
}

// stepper buttons (+ / −) and copy buttons
content.addEventListener("click",e=>{
  const btn=e.target.closest(".stepbtn");
  if(btn){
    adjustScore(btn.dataset.num,btn.dataset.side,+btn.dataset.step);
    return;
  }
  const ck=e.target.dataset.copy;if(!ck)return;
  const round=ROUNDS.find(r=>r.key===ck);
  if(!(data.name||"").trim()){alert("Please choose your name at the top first.");entryName.focus();return;}
  const m=missingForRound(round);missing=m.length?{round:ck,items:m}:null;
  copyText(buildText(ck));render();
});
content.addEventListener("change",e=>{
  if(e.target.dataset.field){const num=e.target.dataset.num;
    const s=data.preds[num]=data.preds[num]||{h:"",a:"",prog:""};
    s[e.target.dataset.field]=e.target.value;save();render();}
});
entryName.addEventListener("change",e=>{data.name=e.target.value;save();});
stageFilter.addEventListener("change",()=>{missing=null;render();});
search.addEventListener("input",render);
document.getElementById("copyAllBtn").onclick=()=>{
  if(!(data.name||"").trim()){alert("Please choose your name at the top first.");entryName.focus();return;}
  copyText(buildText(null));
};
render();
</script>
</body>
</html>
